# config/trading.yaml — trading knobs that Claude can read/write freely.
# Copy this file to config/trading.yaml and customize, or let `trading tune` write it for you.
# Secrets (tokens, encryption key, SMTP creds) live in .env, NEVER here.

# === Execution Mode ===
# paper | dry-run | live | autonomous
execution_mode: paper

# === Strategy and universe ===
default_strategy: bollinger
default_symbols: "XIC.TO,VOO,IWM"
timezone: America/Toronto
# Currency used for equity, sizing, and heat math. Pick the side of your
# Questrade multi-currency account that actually holds cash. CAD for Canadian
# accounts (XIC.TO etc.); USD for US-funded accounts (VOO, AAPL etc.).
account_currency: CAD

# === Risk gates (apply to every order, all modes) ===
risk_pct_per_trade: 0.01            # 1% account risk per trade
portfolio_heat_cap: 0.05            # 5% aggregate open-risk cap
risk_model: cvar                    # how the heat gate estimates per-trade risk:
                                    #   cvar = Expected Shortfall, fat left tail (default)
                                    #   var  = 95% Value-at-Risk of the name's returns
                                    #   atr  = ATR-stop loss
heat_aggregation: corr              # how open positions combine for the heat gate:
                                    #   corr = covariance-aware, credits diversification (default)
                                    #   sum  = naive total, correlation-blind
daily_loss_limit_pct: 0.03          # -3% halts new entries today
max_drawdown_kill_switch: 0.03      # -3% trips kill-switch automatically (tightened 2026-09-08)
max_open_positions: 3
min_ticket_usd: 100.0

# === Stale-quote guard (paper feeds) ===
stale_quote_frozen_s: 900           # quote unchanged this long = stale (0 disables)
stale_quote_max_trade_age_s: 0      # last trade older than this = stale (0 disables; Questrade only)
on_stale_quote: raise               # raise = skip symbol + reject paper fill | warn = log only

# === Exchange hopping ===
# account_currency (above) is the numeraire every IB-paper price and risk gate is measured in.
skip_closed_venues: true            # don't poll or trade a symbol outside its exchange hours
fx_rate_ttl_s: 60                   # refresh IB spot FX at most this often
fx_max_rate_age_s: 900              # older than this with no fresh rate -> quote treated as stale

# === 24h global book (scripts/paper_global.py) ===
scheduler_open_buffer_min: 5        # no orders in the first N min of each session (auction/first prints)
scheduler_close_buffer_min: 10      # nor in the last N min (closing auction)
scheduler_intent_ttl_min: 30        # queued intent expires this long after its release time
max_spread_bps_equity: 50           # entries refused above this spread; exits are never blocked
max_spread_bps_crypto: 30
board_lots: {}                      # per-symbol lot size, required for .HK names, e.g. {"0700.HK": 100}
corr_lead_lag: 1                    # Dimson lags for cross-venue correlation in the heat gate

# === Questrade target ===
# practice | live. 'practice' = Questrade's free practice account; 'live' = real money.
questrade_env: practice
# Empty string = use first account returned by the API.
questrade_account_number: ""

# === Autonomous mode (Claude-driven daemon) ===
autonomous_enabled: false
autonomous_account: practice
autonomous_auto_start_on_session: false
autonomous_interval_seconds: 600     # 10 minutes
autonomous_strategy: bollinger
autonomous_symbols: "XIC.TO,VOO,IWM"
autonomous_daily_max_trades: 5
autonomous_daily_max_notional_usd: 2000.0

# === Storage ===
log_level: INFO
state_dir: state
log_dir: logs
data_cache_dir: data/cache

# === Last auto-tune result (written by `trading tune`) ===
last_tune:
  ran_at: ""
  scoreboard: []
