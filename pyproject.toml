[project]
name = "trading-live-claude"
version = "0.1.0"
description = "Claude Code-driven algorithmic trading framework for Questrade. Paper-first, live behind explicit flag."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "pouria" }]
dependencies = [
    "httpx>=0.27",
    "hishel>=0.0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "tabulate>=0.9",
    "structlog>=24.1",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "plotly>=5.20"]
notify = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
quant = [
    "arch>=8.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
trading = "trading_live_claude.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_live_claude"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses Option()/Argument() as call-valued defaults by design; not a B008 bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=trading_live_claude --cov-report=term-missing"
markers = [
    "network: tests that hit a live network (skipped in CI by default)",
    "live: tests that touch live broker endpoints (NEVER run in CI)",
]
