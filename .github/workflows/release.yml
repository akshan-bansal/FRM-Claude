# Signed release workflow — the coordinator surface for TradeCard.
#
# Fires on any `v*` tag push (v1.0.0, v1.1.0, …). Builds Python wheel +
# sdist, signs both with sigstore (cosign keyless via the GitHub Actions
# OIDC token), publishes signatures to the Rekor transparency log, and
# attaches everything to a GitHub Release.
#
# Card firmware signs the same way in a later commit — the current
# tradecard-shim firmware isn't built in CI yet because ESP-IDF is a
# heavy dependency; when the firmware image is added, drop the same
# sigstore step against the .bin file. Card OTA verifies signatures
# against the sigstore transparency log — no vendor keys to lose.
#
# Nothing outside this repo is called by this workflow. No PyPI upload,
# no Docker Hub push, no coordinator service — GitHub Releases + the
# public Rekor log ARE the coordinator (zero-vendor-infra plan,
# NEXT_SESSION.md §11).
name: tradecard-release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the Release
  id-token: write     # sigstore OIDC — keyless signing
  attestations: write # provenance attestations attached to the artifacts

concurrency:
  group: tradecard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel + sdist
        run: |
          python -m build --wheel --sdist --outdir dist/

      - name: Attest build provenance
        # SLSA v1 provenance — the same key-free supply-chain guarantee
        # that npm, PyPI, and Docker Hub have already adopted.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Sign wheel + sdist with sigstore
        # Keyless — OIDC from this workflow's token, signatures land in
        # the public Rekor transparency log. No vendor key material to
        # rotate or lose.
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: "dist/*"
          release-signing-artifacts: false

      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          # Include the sigstore .sigstore.json (bundle: cert + sig +
          # transparency-log entry) alongside every artifact. Consumers
          # verify offline with:  cosign verify-blob \
          #   --bundle <blob>.sigstore.json --certificate-identity-regexp \
          #   'https://github.com/akshan-bansal/FRM-Claude/.*' \
          #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #   <blob>
          files: |
            dist/*
          generate_release_notes: true
          body: |
            Signed release built by GitHub Actions using sigstore keyless
            signing (OIDC → Fulcio → Rekor).

            **Verify a downloaded artifact:**

            ```
            cosign verify-blob \
              --bundle <artifact>.sigstore.json \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              <artifact>
            ```

            The public Rekor entry for each artifact is queryable at
            <https://search.sigstore.dev/> by the certificate identity
            above.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
